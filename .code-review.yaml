# Code review agent config for this repo (used in GitHub Actions on PRs)
# See https://github.com/ySabore/code-review-agent
rules:
  max_line_length: 120
  disallow_todo_without_ticket: true
  disallow_trailing_whitespace: true
  disallow_tab_indentation: true
  disallow_merge_conflict_markers: true
  require_newline_at_eof: true
  disallow_potential_secrets: true
  disallow_debug_statements: true
  enforce_file_length: false
  max_file_lines: 1500

paths:
  include: ["**/*.java", "**/*.yml", "**/*.yaml", "**/*.gradle", "**/*.py"]
  # Only review source and Gradle config (skip README, docs, scripts, etc.)
  scan_only_under: ["src", "gradle"]
  exclude:
    - "**/build/**"
    - "**/.gradle/**"
    - "**/node_modules/**"
    - "**/nas/**"
    - "**/.DS_Store"
    - "**/gradlew"
    - "**/gradlew.bat"
    - "**/gradle/wrapper/**"
    - "**/samples/**"
    - "**/docs/**"

output:
  format: text
  fail_on_issues: false
