# Spring
spring.application.name=nas-file-processor
spring.quartz.job-store-type=memory
spring.quartz.properties.org.quartz.threadPool.threadCount=5

# Server
server.port=8080

# NAS folder configuration (relative to the working directory)
nas.folders.inbound=nas/inbound
nas.folders.processing=nas/processing
nas.folders.error=nas/error
nas.folders.completed=nas/completed
nas.folders.responses=nas/responses
nas.batch-size=100
# Max concurrent API calls per file. Set to 1 for sequential processing.
nas.parallel-batch-limit=5
nas.file-extension=.json
# When true, scan subfolders recursively and preserve folder structure in completed/error
nas.scan-recursive=true
# Lock file to prevent duplicate processing (important for ControlM)
nas.use-lock-file=true

# Archive: move old files to nas/archive/YYYY-MM/ to manage disk space (disabled by default)
nas.archive.enabled=false
nas.archive.retention-days=30
nas.archive.folder=nas/archive
nas.archive.cron=0 0 2 * * *

# External API configuration
api.base-url=http://localhost:8081
api.endpoint=/api/v1/process
api.about-version-identifier=v1.0.0
api.requesting-system=nasFileProcessor
api.timeout-seconds=30
api.max-retries=3
api.retry-delay-ms=2000
api.auth-token=${API_AUTH_TOKEN:your-token-here}

# Run one processing cycle when the app starts (processes any JSON already in inbound)
processor.run-on-startup=true

# Email notification: send summary when processing cycle completes (disabled by default)
nas.email.enabled=false
# Distribution list - recipients for final response summary
nas.email.distribution[0]=team@example.com
nas.email.distribution[1]=ops@example.com

# Spring Mail (configure for your SMTP server when nas.email.enabled=true)
spring.mail.host=smtp.example.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ControlM job triggers this endpoint - schedule is a fallback
scheduler.cron=0 */10 * * * *
scheduler.enabled=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.com.example.nasprocessor=DEBUG
logging.level.org.springframework=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/nas-processor.log
